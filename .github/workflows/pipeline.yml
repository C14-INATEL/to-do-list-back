name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  setup-and-install:
    name: Setup and Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  test:
    name: Run Tests
    needs: setup-and-install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Run Pytest
        run: |
          pytest

  build-and-validate:
    name: Build and Validate Project
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django Check
        run: python backend/manage.py check

      - name: Django Migrate Check
        run: python backend/manage.py makemigrations --check --dry-run

  simulate-deploy:
    name: Simulação de Deploy e Notificação
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Simulando o processo de Deploy
        run: |
          echo "🚀 Iniciando simulação de deploy..."
          echo "✅ Conectando aos servidores..."
          sleep 2
          echo "✅ Transferindo artefatos..."
          sleep 2
          echo "🎉 Deploy concluído com sucesso no ambiente de Homologação/Produção!"

      - name: Notificação de Sucesso
        if: success()
        run: echo "✅ A pipeline foi executada completamente com sucesso!"

      - name: Notificação de Falha
        if: failure()
        run: echo "❌ Alguma etapa da pipeline falhou. Verifique os logs."
