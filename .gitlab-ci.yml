stages:
  - setup
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

setup-and-install:
  stage: setup
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  only:
    - main
    - master
    - merge_requests

run-tests:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-django
    - cd backend
    - pytest
  only:
    - main
    - master
    - merge_requests
  needs:
    - setup-and-install

coverage-report:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - cd backend
    - coverage run -m pytest
    - coverage report
  only:
    - main
    - master
    - merge_requests
  needs:
    - setup-and-install

lint-code:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - echo "Verificando qualidade do código..."
    - flake8 .
  only:
    - main
    - master
    - merge_requests
  needs:
    - setup-and-install

validate-api-docs:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - echo "Validando geração do schema OpenAPI (Swagger)..."
    - cd backend
    - python manage.py spectacular --validate --fail-on-warn
    - echo "Schema gerado e validado com sucesso."
  only:
    - main
    - master
    - merge_requests
  needs:
    - setup-and-install

build-and-validate:
  stage: build
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - python backend/manage.py check
    - python backend/manage.py makemigrations --check --dry-run
  only:
    - main
    - master
    - merge_requests
  needs:
    - run-tests
    - coverage-report
    - lint-code
    - validate-api-docs

simulate-deploy:
  stage: deploy
  image: python:3.12
  script:
    - echo "🚀 Iniciando simulação de deploy..."
    - echo "✅ Conectando aos servidores..."
    - sleep 2
    - echo "✅ Transferindo artefatos..."
    - sleep 2
    - echo "🎉 Deploy concluído com sucesso no ambiente de Homologação/Produção! 🔥"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        echo "✅ A pipeline foi executada completamente com sucesso!"
      else
        echo "❌ Alguma etapa da pipeline falhou. Verifique os logs."
      fi
  only:
    - main
    - master
  needs:
    - build-and-validate
